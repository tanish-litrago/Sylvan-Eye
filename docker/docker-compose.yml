# Sylvan Eye - layers 1-3: the app container + Postgres (the cache) + Redis (job records only).
# Run it FROM THIS FOLDER:  cd docker  then  docker compose up -d --build
# Secrets and machine paths come from docker/.env (git-ignored; copy .env.example). None are written here.
# The project name is fixed so the Docker volumes keep the names they had before the folder move.

name: sylvaneye

services:
  app:
    build:
      context: ..                       # the project folder
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy      # the app starts only after Postgres accepts connections
      redis:
        condition: service_healthy      # ... and after Redis answers
    ports:
      # 127.0.0.1 only: the app has no login and shows raw error text.
      - "127.0.0.1:8000:8000"
    environment:
      # Ollama runs on the Windows machine (GPU); Docker Desktop provides host.docker.internal.
      SYLVAN_OLLAMA_URL: ${SYLVAN_OLLAMA_URL:-http://host.docker.internal:11434/api/chat}
      # The Google Cloud project registered for Earth Engine (set it in .env or the shell).
      SYLVAN_EE_PROJECT: ${SYLVAN_EE_PROJECT:-sylvan-eye}
      SYLVAN_STORE: postgres
      # The password comes from .env (letters and digits only, so the URL stays valid).
      SYLVAN_DB_URL: postgresql://sylvan:${POSTGRES_PASSWORD}@db:5432/sylvan
      # Job records (state, stage, result, error) live in Redis and expire after an hour.
      # The work itself still runs in threads inside this container.
      SYLVAN_JOBS: redis
      SYLVAN_REDIS_URL: redis://redis:6379/0
    volumes:
      # Your Earth Engine login folder, READ-ONLY. Path comes from .env.
      - "${SYLVAN_EE_DIR:?set SYLVAN_EE_DIR in .env (see docker/.env.example)}:/home/app/.config/earthengine:ro"

  db:
    image: postgres:16-alpine
    # No "ports:" on purpose: only the app (inside the Docker network) can reach the database.
    environment:
      POSTGRES_USER: sylvan
      POSTGRES_DB: sylvan
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see docker/.env.example)}"
    volumes:
      # The cache. A new volume starts empty, so each place takes 1-2 minutes the first time.
      - sylvan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sylvan -d sylvan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No "ports:" on purpose: only the app (inside the Docker network) can reach Redis.
    # Job records are short-lived, so nothing is saved to disk (no volume, no snapshots).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sylvan_pgdata: