name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/requirements.txt
      # No Earth Engine login, Ollama, Postgres or Redis is needed: the tests use saved fixtures and fakes.
      - run: pip install -r requirements/requirements.txt
      - run: python -m tests
